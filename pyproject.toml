[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uaspeech-cut"
version = "0.3.0"
description = "Metadata-driven UASpeech word-level audio and original-frame video reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5,<2", "scipy>=1.10,<2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]

[project.scripts]
uaspeech-cut = "uaspeech_cut.__main__:main"

[tool.setuptools.packages.find]
include = ["uaspeech_cut*"]

