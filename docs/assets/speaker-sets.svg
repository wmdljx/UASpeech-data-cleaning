<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Three nested availability sets in the locally inspected UASpeech package</title>
  <desc id="desc">Audio is available for 28 speakers: 15 dysarthric and 13 controls. Twelve dysarthric speakers have DivX files. Nine of these have at least some legacy word frame indices. M05, M09 and M10 have video but no legacy indices; only M05 and M09 enter our eleven-speaker reconstruction. This is not the current worldwide distribution inventory.</desc>
  <rect width="960" height="410" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#21344b">
    <rect x="16" y="16" width="928" height="378" rx="20" fill="#f1f5fb" stroke="#b7c9df" stroke-width="1.5"/>
    <text x="46" y="59" font-size="24" font-weight="700">Audio</text>
    <text x="908" y="61" text-anchor="end" font-size="34" font-weight="700" fill="#42658e">28</text>
    <text x="46" y="95" font-size="20" fill="#52657b">F03 · M01 · M04 + 13 controls</text>

    <rect x="40" y="122" width="880" height="248" rx="16" fill="#e7f2ef" stroke="#9ebfb4" stroke-width="1.5"/>
    <text x="70" y="165" font-size="24" font-weight="700">Audio + video</text>
    <text x="884" y="167" text-anchor="end" font-size="34" font-weight="700" fill="#397563">12</text>
    <text x="70" y="201" font-size="20" fill="#496b61">M05 · M09 · M10*</text>

    <rect x="64" y="228" width="832" height="118" rx="13" fill="#fff9e9" stroke="#d6c391" stroke-width="1.5"/>
    <text x="94" y="271" font-size="24" font-weight="700">Audio + video + frame index</text>
    <text x="860" y="273" text-anchor="end" font-size="34" font-weight="700" fill="#927024">9</text>
    <text x="94" y="313" font-size="20" fill="#665b3e">F02 · F04 · F05 · M07 · M08 · M11 · M12 · M14 · M16</text>
  </g>
</svg>
