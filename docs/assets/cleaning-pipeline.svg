<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Check the original interval, search when needed, then cut</title>
  <desc id="desc">Extract camera speech using the existing frame index and compare its waveform with the word recording. Keep matching intervals with valid boundaries. For low similarity, boundary conflicts, or missing indices, search the same speaker's full recordings, review the new word and frame interval, and cut the word video.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
    <marker id="passArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b8569"/></marker>
  </defs>
  <rect width="1120" height="380" rx="16" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b40">
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M210 148 H258"/>
      <path d="M448 148 H498"/>
      <path d="M448 45 H598 V108"/>
      <path d="M598 186 V270"/>
      <path d="M354 186 V308 H498" stroke-dasharray="5 4"/>
      <path d="M698 308 H758"/>
      <path d="M858 270 V222 H994 V186"/>
    </g>
    <path d="M698 148 H906" fill="none" stroke="#2b8569" stroke-width="2" marker-end="url(#passArrow)"/>
    <rect x="24" y="108" width="186" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="260" y="108" width="188" height="78" rx="10" fill="#edf5ff" stroke="#9bbfe7"/>
    <rect x="260" y="18" width="188" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="500" y="108" width="198" height="78" rx="10" fill="#edf5ff" stroke="#9bbfe7"/>
    <rect x="908" y="108" width="176" height="78" rx="10" fill="#edf7f3" stroke="#99c7b6"/>
    <rect x="500" y="270" width="198" height="76" rx="10" fill="#fff8e9" stroke="#d9bd80"/>
    <rect x="760" y="270" width="198" height="76" rx="10" fill="#fff8e9" stroke="#d9bd80"/>
    <g font-size="16" font-weight="600" text-anchor="middle">
      <text x="117" y="140">Long video</text>
      <text x="354" y="43">Word recording</text>
      <text x="354" y="140">Use existing frames</text>
      <text x="599" y="140">Compare waveforms</text>
      <text x="996" y="140">Cut word video</text>
      <text x="599" y="301">Search full videos</text>
      <text x="859" y="301">Review new interval</text>
    </g>
    <g font-size="12" fill="#526579" text-anchor="middle">
      <text x="117" y="163">Picture + camera speech</text>
      <text x="354" y="62">Primary reference</text>
      <text x="354" y="163">Extract camera speech</text>
      <text x="599" y="163">Word vs camera audio</text>
      <text x="996" y="163">Use checked frames</text>
      <text x="599" y="325">Same speaker, all blocks</text>
      <text x="859" y="325">Check word and frames</text>
      <text x="801" y="126" fill="#21654f">Match + valid boundaries</text>
      <text x="683" y="216">Low similarity</text>
      <text x="683" y="233">or boundary conflict</text>
      <text x="423" y="295">No index</text>
      <text x="939" y="211">Confirmed</text>
    </g>
  </g>
</svg>
